[project]
name = "ciai-riesgo"
version = "0.1.0"
description = "Territorial risk prioritization, CIAI advanced category"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy", "pandas", "polars", "pyarrow",
  "geopandas", "shapely", "pyproj", "h3",
  "scikit-learn", "lightgbm", "xgboost", "optuna",
  "shap", "mapie",
  "mlflow", "hydra-core", "pandera",
  "fastapi", "uvicorn", "pydantic", "onnx", "onnxruntime",
  "matplotlib", "plotly",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyterlab", "ipykernel"]
dl = ["torch", "pytorch-lightning"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["ml", "app/api"]
